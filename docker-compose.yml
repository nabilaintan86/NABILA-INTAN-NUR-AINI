services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: monitoring-jaringan-app
    container_name: monitoring_app
    restart: always
    working_dir: /var/www/html
    # Bind mount project ke /var/www/html. DocumentRoot Apache mengarah ke
    # /var/www/html/public (lihat Dockerfile + docker/apache/000-default.conf),
    # jadi mount ini tidak menimbulkan konflik dengan root web server.
    volumes:
      - .:/var/www/html
    ports:
      - "8000:80"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=monitoring_db
      - DB_USERNAME=root
      - DB_PASSWORD=secret
    depends_on:
      - db

  # Scheduler Laravel berjalan terus-menerus (tanpa perlu cron di host).
  # Menjalankan `php artisan schedule:work`:
  #   - network:poll  -> tiap 1 menit  (activity_logs)
  #   - monitor:ping  -> tiap 5 menit  (monitoring_logs, notifikasi)
  #   - logs:archive  -> tiap hari 02:00
  scheduler:
    image: monitoring-jaringan-app
    container_name: monitoring_scheduler
    restart: always
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=monitoring_db
      - DB_USERNAME=root
      - DB_PASSWORD=secret
    depends_on:
      - db
    command: php artisan schedule:work

  db:
    image: mysql:8.0
    container_name: monitoring_db
    restart: always
    environment:
      MYSQL_DATABASE: monitoring_db
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata: