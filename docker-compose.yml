services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nioboard-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - nioboard

  nginx:
    image: nginx:alpine
    container_name: nioboard-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - nioboard

  db:
    image: mysql:8.0
    container_name: nioboard-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: device_monitoring
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: secret
      MYSQL_USER: laravel
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - nioboard

networks:
  nioboard:

volumes:
  db_data:
