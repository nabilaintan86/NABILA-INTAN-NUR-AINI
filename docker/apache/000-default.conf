# VirtualHost default untuk aplikasi Laravel.
#
# Dokumentasi:
# - DocumentRoot diarahkan PERMANEN ke folder public/ Laravel.
# - AllowOverride All wajib: tanpa ini Apache mengabaikan file .htaccess di
#   dalam public/ sehingga mod_rewrite tidak pernah dipakai dan route seperti
#   /login, /admin, atau /up akan menghasilkan "404 Not Found" dari Apache.
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    ServerName localhost

    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
